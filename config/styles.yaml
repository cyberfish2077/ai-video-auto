# ============================================================
# 片子风格档位（style profile）
# ------------------------------------------------------------
# 这里管四件"会决定画面长什么样"的文字，都集中在此处，代码里不再写死：
#   style_prefix   拼进每段 H3 提示词最前面的风格行（画质/渲染/镜头质感）
#   bgm_line       拼进每段提示词的"统一背景音乐"要求（各段必须一致，接缝才不断）
#   negative       拼进每段提示词末尾的"负面："清单
#                   （注：本工作流的负面词实际不生效，见 references/H3提示词规范.md 9.1；
#                     保留它只是为了与历史成片格式一致，不要指望它约束画面）
#   story_style    交给 DeepSeek 的风格要求（会体现到角色设定图与分镜图的提示词里）
#   material_style 追加到角色图 / 分镜图提示词末尾的统一风格后缀
#
# 用法：make_script.py / make_video.py 加 --style <档位名>；不加则用 default_profile。
# 新增档位：复制一份改文字即可，改完先跑一次
#   .venv\Scripts\python.exe scripts\make_video.py --name 试跑 --brief-file data\briefs\示例讲稿.txt --style 新档位名 --plan
# ============================================================

default_profile: guofeng-cg

profiles:

  # ----------------------------------------------------------
  # 国风 3D 动漫（历史成片的档位，逐字保留，勿改）
  # ----------------------------------------------------------
  guofeng-cg:
    label: 国风 3D 动漫（玄幻/武侠，历史默认）
    # 以下三行与历史成片（long120-01 等）里使用的文字**逐字一致**，改动会让新片与旧片风格不统一
    style_prefix: "高品质3D国漫CG渲染，精致建模，电影级布光，材质细腻有质感，角色造型跨镜统一，画面干净，无文字无水印，2K超精细，体积光，丁达尔效应，灵气粒子，"
    bgm_line: "本片全程有统一的背景音乐，各段必须保持同一风格与速度：低沉的古琴拨弦与缓慢弦乐，节奏平稳、起伏克制、冷冽肃杀，**不要出现明显的段落结束感或终止感**"
    negative: "对白字幕、旁白字幕、台词字幕、片头字、画面标题、贴纸、水印、界面文字、现代物品、手机、汽车、霓虹、西装、义体、废墟、宫灯、玉玺、圣旨、朝服、赛博朋克机械结构"
    story_style: ""
    material_style: ""

  # ----------------------------------------------------------
  # 电影质感实拍写实（现代/科幻题材用这个）
  # ----------------------------------------------------------
  photoreal-cinematic:
    label: 电影质感写实（实拍感、现代与科幻题材）
    style_prefix: "电影级实拍写实质感，35mm 电影镜头，浅景深，自然光与实景布光，皮肤与服装材质真实，高动态范围，轻微胶片颗粒，手持跟拍的纪实感，色彩层次丰富、低调压抑的灾难片色调，画面干净，无文字无水印，2K 超精细，电影胶片质感，"
    bgm_line: "本片全程有统一的背景音乐，各段必须保持同一风格与速度：持续的低频轰鸣与缓慢推升的管弦弦乐，配合金属刮擦声与心跳般低频鼓点，节奏平稳、起伏克制、压迫紧张，**不要出现明显的段落结束感或终止感**"
    negative: "对白字幕、旁白字幕、台词字幕、片头字、画面标题、贴纸、水印、界面文字、卡通、动漫、二次元、插画、游戏CG、3D渲染感、塑料感、古装、道袍、古风建筑、发光超能力特效"
    story_style: "写实科幻灾难片：现代都市与郊区实景，物理真实、材质真实；人物是现代普通人（现代日常服装，非制服非古装）；外星生物要有生物质感、体液与粗糙外骨骼的真实感，压迫感来自体量与动作而不是魔法光效；禁止任何动漫化、游戏化、插画化的画面描述。"
    material_style: "电影级实拍写实质感，35mm 电影镜头，自然光与实景布光，真实皮肤与衣料材质，照片级写实，现代都市场景，浅景深，低饱和灾难片色调。"
